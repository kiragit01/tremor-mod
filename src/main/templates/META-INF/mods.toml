modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="kiragit01"
logoFile="tremor_logo.png"
description='''
The ground itself is listening. Something vast crawls beneath the surface of the world, a mound that follows every
footstep through the rock. Walk softly, sneak, stay still when the ripples pass. If it reaches you at the peak of its
anger, the earth opens and takes you into the Hollow, and you will have to find its beating heart before the ground
closes in.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
