# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Environment Properties
# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.26
forge_version_range=[47,)
loader_version_range=[47,)

junit_version=5.11.4
# Only used with -Ptremor_embeddium=true (compatibility testing)
embeddium_version=0.3.31+mc1.20.1

## Mod Properties
mod_id=tremor
mod_name=Tremor
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=tremor

## Dev switches (pass with -P on the command line or put into ~/.gradle/gradle.properties)
# tremor_hotswap=true          run the game on JetBrains Runtime 17 (enhanced class redefinition)
# tremor_embeddium=true        add Embeddium to the dev runtime
# tremor_autotest_script=...   script file in ./autotest for runClientAutotest (default stage0.txt)
