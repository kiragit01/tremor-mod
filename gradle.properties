# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
loader_version_range=[1,)

junit_version=5.11.4
# Only used with -Ptremor_sodium=true (compatibility testing)
sodium_version=mc1.21.1-0.8.13-neoforge

## Mod Properties
mod_id=tremor
mod_name=Tremor
mod_license=All Rights Reserved
mod_version=0.0.1
mod_group_id=tremor

## Dev switches (pass with -P on the command line or put into ~/.gradle/gradle.properties)
# tremor_hotswap=true          run the game on JetBrains Runtime 21 (enhanced class redefinition)
# tremor_sodium=true           add Sodium to the dev runtime
# tremor_autotest_script=...   script file in ./autotest for runClientAutotest (default stage0.txt)
